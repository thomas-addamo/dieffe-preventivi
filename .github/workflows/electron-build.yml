name: Build app desktop

# Parte a ogni tag di versione (es. v3.13.0) e pubblica i pacchetti nella Release.
# Avvio manuale (Actions → "Run workflow" su main): crea tag e Release con la
# versione di package.json (es. v3.17.0) e compila i pacchetti.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Crea (o ritrova) la Release della versione, una sola volta per tutte le piattaforme.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione da rilasciare
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Crea la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write # necessario per creare/aggiornare la Release

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile

      # Il pacchetto contiene solo il wrapper (electron/): l'interfaccia è la web
      # app pubblicata, quindi qui non serve "next build" né alcun segreto del DB.
      - name: Prepara il wrapper desktop
        run: pnpm desktop:prepare

      # Icona Liquid Glass (assets/icon.icon): serve actool di Xcode 26. Si
      # seleziona l'Xcode 26 più recente del runner e si prova a compilare
      # l'icona; se non riesce, la build usa l'icona classica (.icns).
      - name: Icona Liquid Glass (Xcode 26)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcrun actool --version || true
          TMP=$(mktemp -d)
          cp -R assets/icon.icon "$TMP/Icon.icon"
          if xcrun actool "$TMP/Icon.icon" --compile "$TMP" --app-icon Icon \
               --output-partial-info-plist "$TMP/info.plist" --platform macosx \
               --target-device mac --minimum-deployment-target 26.0 \
               --output-format human-readable-text --errors --warnings; then
            echo "Icona Liquid Glass compilata"
          else
            echo "::warning::Icona Liquid Glass non compilabile su questo runner: uso l'icona classica"
            echo "MAC_LEGACY_ICON=1" >> "$GITHUB_ENV"
          fi

      # Senza certificato Apple l'app viene firmata ad-hoc (scripts/desktop/after-pack.cjs).
      # Con i secret CSC_LINK / CSC_KEY_PASSWORD (Developer ID) + APPLE_ID /
      # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID viene firmata e notarizzata.
      - name: Crea i pacchetti (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --config electron-builder.config.cjs --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Controllo di sicurezza: la firma dell'app deve essere valida e NON revocata.
      - name: Verifica firma macOS
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          for app in dist-electron/mac*/"Dieffe Preventivi.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier"
            if spctl -a -vvv "$app" 2>&1 | grep -qi revoked; then
              echo "::error::Firma revocata da Apple per $app"; exit 1
            fi
          done

      - name: Pubblica nella Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
