# Progetto Xcode dell'app iPhone, generato con XcodeGen:
#   cd ios && xcodegen        →  Dieffe.xcodeproj (non va nel repository)
# Firma personale (Apple ID gratuito): copia Signing.example.xcconfig in
# Signing.xcconfig e inserisci il tuo Team ID. Vedi ios/README.md.
name: Dieffe
options:
  bundleIdPrefix: it.dieffe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # La versione vera arriva da src/lib/version.ts (fonte unica per sito,
    # app desktop e iPhone): la imposta lo script "Versione" a ogni build.
    MARKETING_VERSION: "3.18.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dieffe:
    type: application
    platform: iOS
    sources:
      - path: Dieffe
    postCompileScripts:
      - name: Versione da src/lib/version.ts
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../src/lib/version.ts
        outputFiles:
          - $(DERIVED_FILE_DIR)/version.stamp
        script: |
          # Stessa versione per sito, app desktop e iPhone (es. 3.18.1).
          V=$(sed -n 's/.*APP_VERSION = "\([0-9.]*\)".*/\1/p' "$SRCROOT/../src/lib/version.ts")
          if [ -n "$V" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            echo "Versione app: $V"
            echo "$V" > "$DERIVED_FILE_DIR/version.stamp"
          else
            echo "warning: versione non trovata in src/lib/version.ts"
          fi
    settings:
      base:
        PRODUCT_NAME: Dieffe
        # Lo script "Versione" scrive nell'Info.plist già generato.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(DIEFFE_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DIEFFE_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dieffe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: Per sbloccare l'app con Face ID.
        INFOPLIST_KEY_NSCameraUsageDescription: Per scattare foto da allegare ai preventivi.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Per scegliere foto da allegare ai preventivi.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Per dettare le descrizioni delle lavorazioni.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
    info:
      path: Dieffe/Info.plist
      properties:
        DieffeBaseURL: $(DIEFFE_BASE_URL)
        # Commit della build (lo imposta Tools/auto-update/agent.sh).
        DieffeCommit: $(DIEFFE_COMMIT)
        ITSAppUsesNonExemptEncryption: false
        # Notifiche locali in background (niente push Apple con l'Apple ID gratuito).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [it.dieffe.preventivi.refresh]
        # dieffe://open?path=/preventivi/<id> apre una pagina dell'app.
        CFBundleURLTypes:
          - CFBundleURLName: it.dieffe.preventivi
            CFBundleURLSchemes: [dieffe]
